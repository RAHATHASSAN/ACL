<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ACL - Player Registration</title>


    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================================================
           BODY
        ========================================================= */

        body {
            font-family: Arial, sans-serif;

            background: #0f172a;

            color: white;

            min-height: 100vh;
        }


        /* =========================================================
           NAVBAR
        ========================================================= */

        nav {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 15px 40px;

            background: rgba(2, 6, 23, 0.95);

            backdrop-filter: blur(10px);

            position: sticky;

            top: 0;

            z-index: 1000;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.4);
        }


        /* LOGO */

        .logo {

            display: flex;

            align-items: center;

            gap: 10px;

            text-decoration: none;
        }


        .logo img {

            width: 42px;

            height: 42px;

            object-fit: contain;
        }


        .logo h2 {

            color: #22c55e;

            font-size: 22px;

            font-weight: 600;
        }


        /* =========================================================
           REGISTRATION SECTION
        ========================================================= */

        #registration {

            padding: 60px 40px;

            max-width: 1400px;

            margin: auto;
        }


        /* TITLE */

        .section-title {

            text-align: center;

            margin-bottom: 40px;
        }


        .section-title h1 {

            font-size: 36px;

            color: #22c55e;

            margin-bottom: 10px;
        }


        .section-title p {

            color: #94a3b8;

            font-size: 15px;
        }


        /* =========================================================
           PLAYER GRID
        ========================================================= */

        .reg-container {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(260px, 1fr));

            gap: 25px;
        }


        /* =========================================================
           PLAYER CARD
        ========================================================= */

        .reg-card {

            background: #1e293b;

            border: 1px solid #334155;

            border-radius: 18px;

            padding: 25px;

            text-align: center;

            transition: 0.3s;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.2);
        }


        .reg-card:hover {

            transform: translateY(-7px);

            border-color: #22c55e;

            box-shadow:
                0 15px 35px rgba(34, 197, 94, 0.15);
        }


        /* =========================================================
           PLAYER IMAGE
        ========================================================= */

        .reg-card img {

            width: 110px;

            height: 110px;

            border-radius: 50%;

            object-fit: cover;

            border: 3px solid #22c55e;

            margin-bottom: 15px;
        }


        /* NO IMAGE */

        .no-image {

            width: 110px;

            height: 110px;

            border-radius: 50%;

            background: #0f172a;

            border: 3px solid #334155;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 0 auto 15px;

            font-size: 40px;
        }


        /* =========================================================
           PLAYER NAME
        ========================================================= */

        .reg-card h3 {

            font-size: 20px;

            margin-bottom: 12px;

            color: white;

            text-transform: capitalize;
        }


        /* =========================================================
           PLAYER INFO
        ========================================================= */

        .player-info {

            color: #cbd5e1;

            font-size: 14px;

            line-height: 1.9;

            margin-bottom: 15px;
        }


        /* =========================================================
           STATUS
        ========================================================= */

        .status {

            display: inline-block;

            padding: 7px 18px;

            border-radius: 30px;

            font-size: 12px;

            font-weight: bold;

            letter-spacing: 1px;
        }
        .pending{
    background:#78350f;
    color:#fbbf24;
    border:1px solid #f59e0b;
}


        .approved {

            background: #14532d;

            color: #4ade80;

            border: 1px solid #22c55e;
        }
        .rejected{
    background:#7f1d1d;
    color:#f87171;
    border:1px solid #ef4444;
}



        /* =========================================================
           EMPTY MESSAGE
        ========================================================= */

        .empty {

            text-align: center;

            padding: 60px 20px;

            background: #1e293b;

            border-radius: 18px;

            border: 1px solid #334155;

            grid-column: 1 / -1;
        }


        .empty h2 {

            color: #94a3b8;

            margin-bottom: 10px;
        }


        .empty p {

            color: #64748b;
        }


        /* =========================================================
           LOADING
        ========================================================= */

        .loading {

            text-align: center;

            color: #22c55e;

            font-size: 18px;

            padding: 50px;

            grid-column: 1 / -1;
        }


        /* =========================================================
           ERROR
        ========================================================= */

        .error-box {

            text-align: center;

            padding: 60px 20px;

            background: #1e293b;

            border-radius: 18px;

            border: 1px solid #7f1d1d;

            grid-column: 1 / -1;
        }


        .error-box h2 {

            color: #f87171;

            margin-bottom: 10px;
        }


        .error-box p {

            color: #94a3b8;

            line-height: 1.7;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 600px) {

            nav {

                padding: 15px 20px;
            }


            .logo h2 {

                font-size: 19px;
            }


            #registration {

                padding: 40px 20px;
            }


            .section-title h1 {

                font-size: 28px;
            }


            .section-title p {

                font-size: 14px;
            }


            .reg-container {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================================
         NAVBAR
    ========================================================= -->

    <nav>

        <a href="index.html" class="logo">

            <img
                src="./Assets/acl logo/remove-photos-background-removed.png"
                alt="ACL Logo"
            >

            <h2>ACL League</h2>

        </a>

    </nav>



    <!-- =========================================================
         PLAYER REGISTRATION SECTION
    ========================================================= -->

    <section id="registration">


        <div class="section-title">

            <h1>
                🏏 Player Registration
            </h1>

            <p>
                Officially approved players of ACL League
            </p>

        </div>



        <!-- PLAYER CONTAINER -->

        <div
            class="reg-container"
            id="regContainer"
        >

            <div class="loading">

                Loading players...

            </div>

        </div>


    </section>



    <!-- =========================================================
         JAVASCRIPT
    ========================================================= -->

    <script>

const container =
    document.getElementById("regContainer");


fetch(
    "http://localhost/acl_admin/api/registrations-api.php"
)

.then(response => {

    if(!response.ok){

        throw new Error(
            "Server response error"
        );

    }

    return response.json();

})


.then(data => {

    container.innerHTML = "";


    if(
        !data.success ||
        !data.registrations ||
        data.registrations.length === 0
    ){

        container.innerHTML = `

            <div class="empty">

                <h2>
                    👤 No Registrations
                </h2>

                <p>
                    No player registration found.
                </p>

            </div>

        `;

        return;

    }


    data.registrations.forEach(
        player => {


        const card =
            document.createElement("div");


        card.className =
            "reg-card";


        /* =========================
           IMAGE
        ========================= */

        let imageHTML = "";


        if(
            player.image &&
            player.image !== ""
        ){

            imageHTML = `

                <img
                    src="http://localhost/acl_admin/${player.image}"
                    alt="${player.name}"
                >

            `;

        }else{

            imageHTML = `

                <div class="no-image">

                    👤

                </div>

            `;

        }


        /* =========================
           PENDING
        ========================= */

        if(
            player.status === "pending"
        ){

            card.innerHTML = `

                ${imageHTML}

                <h3>
                    ${player.name}
                </h3>


                <div class="player-info">

                    🏏 Jersey:
                    ${player.jersey_number ?? "-"}

                    <br>

                    👕 Size:
                    ${player.jersey_size ?? "-"}

                </div>


                <span
                    class="status pending"
                >

                    ⏳ PENDING

                </span>

            `;

        }


        /* =========================
           APPROVED
        ========================= */

        else if(
            player.status === "approved"
        ){

            card.innerHTML = `

                ${imageHTML}

                <h3>
                    ${player.name}
                </h3>


                <div class="player-info">

                    🏏 Jersey:
                    ${player.jersey_number ?? "-"}

                    <br>

                    👕 Size:
                    ${player.jersey_size ?? "-"}

                </div>


                <span
                    class="status approved"
                >

                    ✓ APPROVED

                </span>

            `;

        }


        /* =========================
           REJECTED
        ========================= */

        else if(
            player.status === "rejected"
        ){

            card.innerHTML = `

                ${imageHTML}

                <h3>
                    ${player.name}
                </h3>


                <div class="player-info">

                    🏏 Jersey:
                    ${player.jersey_number ?? "-"}

                </div>


                <span
                    class="status rejected"
                >

                    ✕ REJECTED

                </span>

            `;

        }


        container.appendChild(card);

    });

})


.catch(error => {

    console.error(
        "Registration loading error:",
        error
    );


    container.innerHTML = `

        <div class="empty">

            <h2>
                ⚠️ Unable to Load Registrations
            </h2>

            <p>
                Please check your server and API connection.
            </p>

        </div>

    `;

});

</script>


</body>

</html>
