<!DOCTYPE html>
<html>
<head>

<!-- CSS -->
 <style>
 .register-section{

padding:70px 20px;

background:#0f172a;

display:flex;

justify-content:center;

}

.register-card{

width:100%;

max-width:700px;

background:rgba(255,255,255,.05);

backdrop-filter:blur(20px);

padding:40px;

border-radius:20px;

border:1px solid rgba(255,255,255,.1);

box-shadow:0 15px 40px rgba(0,0,0,.35);

}

.register-card h2{

text-align:center;

color:#22c55e;

margin-bottom:10px;

}

.register-card p{

text-align:center;

margin-bottom:30px;

color:#cbd5e1;

}

.input-group{

margin-bottom:20px;

}

.input-group label{

display:block;

margin-bottom:8px;

font-weight:600;

}

.input-group input,

.input-group select{

width:100%;

padding:15px;

border:none;

outline:none;

background:#1e293b;

color:#fff;

border-radius:10px;

font-size:15px;

}

.double{

display:grid;

grid-template-columns:1fr 1fr;

gap:20px;

}

.payment-options{

display:flex;

gap:20px;

margin:20px 0;

flex-wrap:wrap;

}

.payment-options label{

background:#1e293b;

padding:12px 20px;

border-radius:50px;

cursor:pointer;

}

.payment-box{

background:#1e293b;

padding:20px;

border-radius:12px;

margin-bottom:20px;

border-left:5px solid #22c55e;

}

.submit-btn{

width:100%;

padding:16px;

border:none;

background:#22c55e;

color:white;

font-size:18px;

font-weight:700;

border-radius:12px;

cursor:pointer;

transition:.3s;

}

.submit-btn:hover{

background:#16a34a;

transform:translateY(-3px);

}

hr{

margin:30px 0;

border-color:#334155;

}

#onlinePayment{

display:none;

}

@media(max-width:768px){

.double{

grid-template-columns:1fr;

}

.register-card{

padding:25px;

}

}
/* NAVBAR */
/* NAVBAR */
nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 40px;
    background:rgba(2,6,23,0.9);
    backdrop-filter:blur(10px);
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
}

/* LOGO */
.logo{
    display:flex;
    align-items:center;
    gap:10px; /* spacing */
}
.logo{
    text-decoration:none;
}

.logo img{
    width:42px;
    height:42px;
    object-fit:contain;
    display:block;
}

.logo h2{
    color:#22c55e;
    font-size:22px;
    font-weight:600;
    line-height:1; /* 🔥 important */
    margin:0;
    display:flex;
    align-items:center;
}

/* NAV LINKS */
nav ul{
    display:flex;
    list-style:none;
}

nav ul li{
    margin-left:25px;
}

nav ul li a{
    color:white;
    text-decoration:none;
    font-size:15px;
    position:relative;
    transition:0.3s;
}

/* hover underline effect */
nav ul li a::after{
    content:"";
    position:absolute;
    width:0%;
    height:2px;
    bottom:-5px;
    left:0;
    background:#22c55e;
    transition:0.3s;
}

nav ul li a:hover::after{
    width:100%;
}

nav ul li a:hover{
    color:#22c55e;
}
</style>
</head>

<body>

  <!-- ================= NAVBAR ================= -->

<nav>

    <a href="index.html" class="logo">

        <img
            src="./Assets/acl logo/remove-photos-background-removed.png"
            alt="ACL Logo"
        >

        <h2>ACL League</h2>

    </a>

</nav>


<!-- ================= REGISTRATION ================= -->

<section class="register-section">

    <div class="register-card">

        <h2>🏏 ACL Player Registration</h2>

        <p>
            Complete your registration to participate in ACL Season 07.
        </p>


        <!-- MESSAGE -->

        <div id="message" class="message"></div>


        <!-- FORM -->

        <form
            id="registerForm"
            enctype="multipart/form-data"
        >


            <!-- PLAYER NAME -->

            <div class="input-group">

                <label for="name">
                    Player Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter player name"
                    required
                >

            </div>


            <!-- PHONE -->

            <div class="input-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="01XXXXXXXXX"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@gmail.com"
                    required
                >

            </div>


            <!-- JERSEY -->

            <div class="double">


                <div class="input-group">

                    <label for="jersey_size">
                        Jersey Size
                    </label>

                    <select
                        id="jersey_size"
                        name="jersey_size"
                        required
                    >

                        <option value="">
                            Select Size
                        </option>

                        <option value="S">S</option>

                        <option value="M">M</option>

                        <option value="L">L</option>

                        <option value="XL">XL</option>

                        <option value="XXL">XXL</option>
                        <option value="3XL">3XL</option>

                    </select>

                </div>


                <div class="input-group">

                    <label for="jersey_number">
                        Jersey Number
                    </label>

                    <input
                        type="number"
                        id="jersey_number"
                        name="jersey_number"
                        min="1"
                        max="999"
                        placeholder="e.g. 10"
                        required
                    >

                </div>


            </div>


            <!-- PLAYER IMAGE -->

            <div class="input-group">

                <label for="player_image">
                    Player Image
                </label>

                <input
                    type="file"
                    id="player_image"
                    name="player_image"
                    accept="image/jpeg,image/png,image/webp"
                    required
                >

            </div>


            <hr>


            <!-- PAYMENT -->

            <h3>
                💳 Payment Method
            </h3>


            <div class="payment-options">


                <label>

                    <input
                        type="radio"
                        name="payment_method"
                        value="bkash"
                    >

                    bKash

                </label>


                <label>

                    <input
                        type="radio"
                        name="payment_method"
                        value="nagad"
                    >

                    Nagad

                </label>


                <label>

                    <input
                        type="radio"
                        name="payment_method"
                        value="offline"
                    >

                    Offline Pay

                </label>


            </div>


            <!-- ONLINE PAYMENT -->

            <div id="onlinePayment">


                <div class="payment-box">

                    <h4>
                        Send Registration Fee
                    </h4>

                    <p>
                        <b>bKash:</b> 017XXXXXXXX
                    </p>

                    <p>
                        <b>Nagad:</b> 018XXXXXXXX
                    </p>

                </div>


                <!-- PAYMENT NUMBER -->

                <div class="input-group">

                    <label for="payment_number">
                        Payment Number
                    </label>

                    <input
                        type="text"
                        id="payment_number"
                        name="payment_number"
                        placeholder=" যে নম্বর থেকে টাকা পাঠিয়েছেন "
                    >

                </div>


                <!-- TRANSACTION ID -->

                <div class="input-group">

                    <label for="transaction_id">
                        Transaction ID
                    </label>

                    <input
                        type="text"
                        id="transaction_id"
                        name="transaction_id"
                        placeholder="Enter Transaction ID"
                    >

                </div>


                <!-- PAYMENT SCREENSHOT -->

                <div class="input-group">

                    <label for="payment_screenshot">
                        Payment Screenshot
                    </label>

                    <input
                        type="file"
                        id="payment_screenshot"
                        name="payment_screenshot"
                        accept="image/jpeg,image/png,image/webp"
                    >

                </div>


            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="submit-btn"
                id="submitBtn"
            >

                Register Player

            </button>


        </form>

    </div>

</section>


<script>


/* ==========================================
   PAYMENT METHOD
========================================== */

const paymentRadios =
    document.querySelectorAll(
        "input[name='payment_method']"
    );


const paymentDiv =
    document.getElementById("onlinePayment");


const paymentNumber =
    document.getElementById("payment_number");


const transactionId =
    document.getElementById("transaction_id");


const paymentScreenshot =
    document.getElementById("payment_screenshot");


paymentRadios.forEach(radio => {

    radio.addEventListener("change", function(){

        if(
            this.value === "bkash" ||
            this.value === "nagad"
        ){

            paymentDiv.style.display = "block";

            paymentNumber.required = true;

            transactionId.required = true;

            paymentScreenshot.required = true;

        }

        else{

            paymentDiv.style.display = "none";

            paymentNumber.required = false;

            transactionId.required = false;

            paymentScreenshot.required = false;

        }

    });

});


/* ==========================================
   FORM SUBMIT
========================================== */

const form =
    document.getElementById("registerForm");


const message =
    document.getElementById("message");


const submitBtn =
    document.getElementById("submitBtn");


form.addEventListener("submit", async function(e){

    e.preventDefault();


    message.className = "message";

    message.innerHTML = "";


    submitBtn.disabled = true;

    submitBtn.innerText = "Submitting...";


    const formData =
        new FormData(form);


    try{


        /*
        ==========================================
        IMPORTANT

        এখানে তোমার PHP API URL বসবে।

        এখন temporarily এই URL রাখা হলো।

        পরে InfinityFree hosting করার পর
        তোমার actual API URL বসাবো।
        ==========================================
        */

        const response = await fetch(
            // "https://YOUR-DOMAIN.infinityfreeapp.com/api/register.php",
            // "http://localhost/acl_admin/api/register.php",
            // "http://127.0.0.1/acl_admin/api/register.php",
            // "http://localhost/acl_admin/api/register.php",
            "http://localhost/acl_admin/api/register.php",
            {
                method:"POST",
                body:formData
            }
        );


        const data =
            await response.json();


        if(data.success){

            message.className =
                "message success";

            message.innerHTML =
                "✅ Registration submitted successfully!";


            form.reset();

            paymentDiv.style.display = "none";

        }

        else{

            message.className =
                "message error";

            message.innerHTML =
                "❌ " +
                (data.message ||
                "Registration failed.");

        }


    }

    catch(error){

        console.error(error);


        message.className =
            "message error";

        message.innerHTML =
            "❌ Server connection failed. Please try again.";

    }


    submitBtn.disabled = false;

    submitBtn.innerText =
        "Register Player";

});


</script>


</body>

</html>
